<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b10"><meta name="description" content="Jakob Reset — workouts, habits and progress.">
<title>Jakob Reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">J</div><div><strong>JAKOB</strong><span>RESET SYSTEM</span></div></div>
  <div class="side-label">WORKSPACE</div>
  <nav id="sideNav">
    <button class="nav-item active" data-view="today"><span>◷</span> Overview</button>
    <button class="nav-item" data-view="workouts"><span>▤</span> Workouts</button>
    <button class="nav-item" data-view="library"><span>⌕</span> Exercise library</button>
    <button class="nav-item" data-view="progress"><span>↗</span> Progress</button>
    <button class="nav-item" data-view="care"><span>✳</span> Daily care</button>
    <button class="nav-item" data-view="settings"><span>⚙</span> Data & settings</button>
  </nav>
  <div class="sidebar-bottom"><div class="status-dot"></div><span>Saved on this device</span><small id="saveState">Ready</small></div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="eyebrow" id="dateLine">YOUR PERSONAL DASHBOARD</div><h1 id="pageTitle">Overview</h1></div><div class="top-right"><span class="local-pill"><i></i> LOCAL PROFILE</span><div class="avatar">J</div></div></header>
  <div id="content" class="content"></div>
</main>
</div>
<div class="mobile-nav" id="mobileNav">
<button class="active" data-view="today"><b>◷</b>Home</button><button data-view="workouts"><b>▤</b>Plan</button><button data-view="library"><b>⌕</b>Exercises</button><button data-view="progress"><b>↗</b>Progress</button><button data-view="settings"><b>⚙</b>More</button>
</div>
<div id="toast" class="toast"></div>
<input type="file" id="planInput" accept=".json,application/json" hidden><input type="file" id="backupInput" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body></html>
